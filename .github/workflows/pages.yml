name: Publish plugin to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Each job receives only the permissions it needs. No npm credentials are used.
permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Reject outdated main runs
        shell: bash
        run: |
          current_main=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "This run is not the current main revision. Publish the latest main run instead."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
      - name: Install build dependencies
        run: npm ci
      - name: Build and test the plugin
        run: npm test
      - name: Verify the installable package
        run: npm run test:package
      - name: Prepare the public static files
        run: node scripts/build-pages.mjs --revision "$GITHUB_SHA" --output .pages
      - name: Upload only the prepared Pages site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: .pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
